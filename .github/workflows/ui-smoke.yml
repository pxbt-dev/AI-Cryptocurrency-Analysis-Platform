name: UI smoke

# Playwright smoke tests against a deployed copy of the site.
#
#   status            Railway reports a successful PR-environment deploy -> test that
#                     preview URL and post a "UI smoke" status back on the PR's commit.
#                     (Kept out of ci.yml: with Railway's "Wait for CI", a preview can
#                     wait for CI to finish, so a CI job waiting for the preview would deadlock.)
#   pull_request      Only when the UI tests themselves change: run them against production
#                     as a sanity check of the suite. Read-only requests.
#   workflow_dispatch Run against any URL by hand (defaults to production).

run-name: >-
  ${{ github.event_name == 'status' && format('UI smoke: {0}', github.event.description)
   || github.event_name == 'pull_request' && format('UI smoke (suite check vs production): PR #{0}', github.event.pull_request.number)
   || format('UI smoke: {0}', inputs.base_url) }}

on:
  status:
  pull_request:
    branches: [master]
    paths:
      - "ui-tests/**"
      - ".github/workflows/ui-smoke.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test"
        required: true
        default: "https://www.aicryptopredictor.com"

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.event.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    name: UI smoke
    # For status events: only Railway's successful deploys of this project, and not production
    if: >-
      github.event_name != 'status'
      || (github.event.state == 'success'
          && startsWith(github.event.context, 'aicryptopredictor')
          && !endsWith(github.event.description, 'aicryptopredictor.com'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Work out which URL and commit to test
        id: target
        env:
          EVENT: ${{ github.event_name }}
          DESCRIPTION: ${{ github.event.description }}
          STATUS_SHA: ${{ github.event.sha }}
          INPUT_URL: ${{ inputs.base_url }}
        run: |
          case "$EVENT" in
            status)
              # Railway's description looks like "Success - <service>-<env>.up.railway.app"
              domain="${DESCRIPTION##* - }"
              if ! printf '%s' "$domain" | grep -Eq '^[a-z0-9.-]+\.up\.railway\.app$'; then
                echo "Not a Railway preview domain: '$DESCRIPTION' - skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              url="https://$domain"; sha="$STATUS_SHA" ;;
            pull_request)
              url="https://www.aicryptopredictor.com"; sha="" ;;
            *)
              url="$INPUT_URL"; sha="" ;;
          esac
          echo "Testing $url ${sha:+(commit $sha)}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Mark the PR commit as pending
        if: steps.target.outputs.skip == 'false' && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context="UI smoke" \
            -f target_url="$RUN_URL" -f description="Testing the Railway preview"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.skip == 'false'
        with:
          # For a preview, use the tests from the commit that was deployed
          ref: ${{ steps.target.outputs.sha || github.sha }}

      - name: Wait for the app to report healthy
        if: steps.target.outputs.skip == 'false'
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          # A fresh deploy can take a few minutes to finish starting Spring and loading data
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 "$URL/actuator/health" | grep -q '"UP"'; then
              echo "Healthy after ~$((i * 10))s"; exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/actuator/health did not report UP within 6 minutes"; exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.target.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install Playwright
        if: steps.target.outputs.skip == 'false'
        working-directory: ui-tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: tests
        if: steps.target.outputs.skip == 'false'
        working-directory: ui-tests
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always() && steps.target.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ui-tests/playwright-report/
            ui-tests/test-results/
          retention-days: 14

      - name: Report the result on the PR commit
        if: always() && steps.target.outputs.skip == 'false' && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
          URL: ${{ steps.target.outputs.url }}
        run: |
          if [ "$OUTCOME" = "success" ]; then state=success; desc="Passed against $URL"
          else state=failure; desc="Failed against $URL"; fi
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state="$state" -f context="UI smoke" \
            -f target_url="$RUN_URL" -f description="${desc:0:140}"
