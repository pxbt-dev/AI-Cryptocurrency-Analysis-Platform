name: CI

# Agentic pipeline, chained with `needs:` so it shows as one job graph per run.
#   Phase 0: Build -> Unit tests on every PR and push to master
#   Phase 1: AI review (advisory) on every PR
#   Guard:   on master, fails if anything other than a person pushed (blocks Railway deploy)
# Later phases add API tests, UI smoke tests on a Railway preview and failure triage.

run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
   || github.event_name == 'workflow_dispatch' && format('Manual run on {0}{1}', github.ref_name, inputs.run_backtest && ' + backtest' || '')
   || format('{0}: {1}', github.ref_name, github.event.head_commit.message) }}

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Also run the live-data backtest (advisory, needs Binance access)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"

jobs:
  # Tripwire: master should only change through a person merging a PR. A push by a bot or
  # app (e.g. the coding agent) fails here, and Railway's "Wait for CI" then refuses to
  # deploy it. GitHub Free can't enforce branch protection on this private repo; this can.
  # IMPORTANT: this job runs from the pushed commit, so it only works while no bot/app with
  # access to this repo has "Workflows: write". Don't grant that permission to the agent's app.
  guard:
    name: Guard (master changed by a person)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check who pushed
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_TYPE: ${{ github.event.sender.type }}
        run: |
          if [ "$ACTOR_TYPE" != "User" ] || [[ "$ACTOR" == *"[bot]" ]]; then
            echo "::error title=Blocked push to master::master was pushed by '$ACTOR' ($ACTOR_TYPE), not a person. Railway will not deploy this. Revert it and open a PR instead."
            exit 1
          fi
          echo "master updated by $ACTOR ($ACTOR_TYPE) - OK"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile and package
        run: mvn -B -ntp -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-jar
          path: target/ai-trading-charts-*.jar
          retention-days: 7

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Runs with no network dependency: the Spring "test" profile switches off
      # training, WebSockets and schedulers; external APIs are stubbed with WireMock.
      - name: Run tests with coverage
        run: mvn -B -ntp verify

      - name: Write test and coverage summary
        if: always()
        run: |
          {
            echo "### Unit tests"
            if ls target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
              awk -F'"' '/<testsuite /{
                  for (i = 1; i < NF; i++) {
                    if ($i ~ /tests=$/)    t += $(i+1)
                    if ($i ~ /failures=$/) f += $(i+1)
                    if ($i ~ /errors=$/)   e += $(i+1)
                    if ($i ~ /skipped=$/)  s += $(i+1)
                  }
                }
                END { printf "| Tests | Failed | Errors | Skipped |\n|---|---|---|---|\n| %d | %d | %d | %d |\n", t, f, e, s }' \
                target/surefire-reports/TEST-*.xml
            else
              echo "No test reports found."
            fi
            echo
            echo "### Coverage (JaCoCo, report only)"
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
                END {
                  printf "| Lines | Branches | Instructions |\n|---|---|---|\n"
                  printf "| %.1f%% | %.1f%% | %.1f%% |\n", 100*lc/(lc+lm), (bc+bm ? 100*bc/(bc+bm) : 0), 100*ic/(ic+im)
                }' target/site/jacoco/jacoco.csv
            else
              echo "No coverage report found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14

  ai-review:
    name: AI review (advisory)
    needs: build
    # PRs only; skip drafts and PRs from forks (forks get no secrets anyway)
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory: continue-on-error sits on the review step (below), not the job, so a
    # failed or timed-out review leaves a warning but the check itself stays green.
    # A red check would hold back Railway's preview deploy ("Wait for CI").
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review PR with Claude
        id: review
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Built-in token: comments come from github-actions[bot]; no GitHub App needed
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the code reviewer for this repository. Read CLAUDE.md first; its house
            rules are the main review checklist. Then review the PR diff (`gh pr diff`).

            Focus, in order:
            1. Bugs and behaviour changes, especially to predictions, data fetching and startup.
            2. Security: new public endpoints, secrets, actuator/springdoc exposure,
               anything bypassing AdminEndpointFilter.
            3. Tests: live network calls in tests, missing tests for bug fixes or new
               behaviour, assertions on real market data.
            4. Railway risks: memory use (512 MB heap), new background work that ignores
               app.background.enabled, a root Dockerfile, moved system.properties.

            How to respond:
            - Use inline comments for specific lines. Only comment on real problems;
              skip style nitpicks and praise.
            - Finish with one short top-level summary comment: a verdict line
              ("Looks good", "Minor issues" or "Needs changes") and the main points.
            - Do not approve or request changes; this review is advisory.
            - Do not edit files, commit or push.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

      - name: Flag a review that didn't complete
        if: steps.review.outcome != 'success'
        run: |
          msg="AI review did not complete (outcome: ${{ steps.review.outcome }}). Usually an API key, credit or rate-limit problem; see the step log. Advisory only, so this doesn't block the PR."
          echo "::warning title=AI review incomplete::$msg"
          echo "### ⚠️ AI review incomplete" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  backtest:
    name: Backtest (live data, advisory)
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_backtest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Market data moves, and Binance may refuse requests from GitHub's runners,
    # so this job reports results but never fails the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backtest
        run: mvn -B -ntp verify -Pbacktest

      - name: Upload backtest output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backtest-reports
          path: target/surefire-reports/
          retention-days: 14
