# Test profile: the app starts fully offline.
# Activate with @ActiveProfiles("test").

# No ML training, no WebSocket streams, no startup preload/backtest, no @Scheduled jobs
app.training.enabled=false
app.background.enabled=false

# No metrics export to Grafana
management.otlp.metrics.export.enabled=false

# Point every external API at a closed local port, so an accidental live call
# fails fast instead of reaching the internet. Tests that need a response start
# WireMock and override these URLs.
binance.api.base-url=http://127.0.0.1:9/api/v3
feargreed.api.url=http://127.0.0.1:9/fng/?limit=1
binance.futures.funding-url=http://127.0.0.1:9/fapi/v1/premiumIndex?symbol=%sUSDT
