name: Coding agent

# Phase 3: Claude implements a ticket.
#   - Add the `agent:build` label to an issue  -> Claude reads it, creates a claude/... branch,
#     implements the change with tests, runs exactly `mvn -B -ntp verify`, commits to that
#     branch through the GitHub API, and replies on the issue with a ready-made "Create PR"
#     link. You open the PR; CI, the AI review and the Railway preview then run as for any PR.
#   - Comment `@claude ...` on an issue or PR -> Claude answers or makes the requested change.
#     On an open PR it commits to that PR's branch.
#
# Only users with write access can trigger it (checked by the action). Claude never merges or
# approves. Its own tools can only commit to the branch the workflow picked (use_commit_signing),
# and it has no `git push`.
#
# Security model, honestly stated: `mvn verify` runs test/pom code the agent writes, inside a
# job that can mint the app token. That code could in principle push to master directly. The
# backstop is the "Guard" job in ci.yml: any push to master not made by a person fails CI, and
# Railway's "Wait for CI" then won't deploy it. (It stops the deploy, not the push itself:
# blocking the push needs a master ruleset, which GitHub Free doesn't enforce on private repos.
# A red Guard on master means: revert that commit.) The Guard only holds if the app token CANNOT edit
# .github/workflows/ (no "Workflows: write" permission); otherwise one push could remove the Guard.
#
# So the agent acts as our own GitHub App (secrets AGENT_APP_ID / AGENT_APP_PRIVATE_KEY), created
# with only Contents, Issues and Pull requests: read & write. NEVER give that app the Workflows
# permission. Its token also makes the agent's commits trigger CI, which the built-in
# GITHUB_TOKEN would not. The built-in token here is read-only and there is no OIDC token.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: Coding agent
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:build')
      || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
          && github.event.comment.user.type != 'Bot')
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')
          && github.event.comment.user.type != 'Bot')
      || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')
          && github.event.review.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One agent run per issue/PR at a time; queue rather than cancel half-finished work
    concurrency:
      group: coding-agent-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # The built-in GITHUB_TOKEN stays read-only: every write goes through our app's token,
    # whose permissions are capped by the app (no Workflows). No id-token: nothing to mint.
    permissions:
      contents: read         # checkout only
    steps:
      - name: Get a token for the agent's GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          # Scope the token to this repo and to exactly what the agent needs
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Don't leave any token in .git/config for the agent (the action sets up its own)
          persist-credentials: false

      # So the agent can build and run the test suite before pushing
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Best-effort only: catches an accidental `git push` to master. It is not a security
      # boundary (files under .git can be edited); the real backstops are API-only commits
      # pinned to the agent's branch, and the Guard job in ci.yml.
      - name: Block pushes to master
        run: |
          cat > .git/hooks/pre-push <<'EOF'
          #!/bin/sh
          while read -r local_ref local_sha remote_ref remote_sha; do
            case "$remote_ref" in
              refs/heads/master|refs/heads/main)
                echo "pre-push: the coding agent may not push to $remote_ref. Push a claude/... branch instead." >&2
                exit 1 ;;
            esac
          done
          EOF
          chmod +x .git/hooks/pre-push

      - name: Run Claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          label_trigger: "agent:build"
          branch_prefix: "claude/"
          track_progress: true
          # Commit via the GitHub API to the agent's branch (verified commits, no git push tool)
          use_commit_signing: "true"
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(mvn -B -ntp verify)"
            --append-system-prompt "You are the coding agent for this repository. Follow CLAUDE.md, especially its house rules and the 'Working as the coding agent' section. Keep changes to what the ticket asks for. Every bug fix needs a test that fails without the fix. Run exactly 'mvn -B -ntp verify' (no other Maven commands are allowed) before you finish and only report success if it passes; if it fails and you cannot fix it, say so plainly. Never push to master, never merge, never edit .github/workflows/, and never touch secrets."
